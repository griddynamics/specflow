<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProcessFlow — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class="gdg-root" id="root"></div>
<script>
  var G = window.GDGlass, h = React.createElement;
  var lanes = [{ id:'client', label:'Client', icon:'users' }, { id:'gd', label:'GD delivery', icon:'cube' }, { id:'plat', label:'Platform', icon:'cloud' }];
  var steps = [
    { id:'s', type:'start', title:'Use-case request', lane:'client', col:0 },
    { id:'w', type:'step', title:'Discovery workshop', owner:'2 days', lane:'gd', col:1 },
    { id:'d', type:'decision', title:'Fit for AI\u2011native?', lane:'gd', col:2 },
    { id:'p', type:'step', title:'Build pilot', owner:'6 weeks', lane:'plat', col:3 },
    { id:'a', type:'step', title:'Advisory roadmap', owner:'2 weeks', lane:'client', col:3 },
    { id:'r', type:'subprocess', title:'Production rollout', owner:'Release train', lane:'plat', col:4 },
    { id:'e', type:'end', title:'Value review', lane:'client', col:5 }];
  var edges = [
    { from:'s', to:'w' }, { from:'w', to:'d' },
    { from:'d', to:'p', label:'Yes', fromSide:'bottom', toSide:'left' },
    { from:'d', to:'a', label:'No', fromSide:'top', toSide:'left' },
    { from:'p', to:'r' }, { from:'r', to:'e', fromSide:'top', toSide:'bottom' }, { from:'a', to:'e', kind:'async' }];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(G.ProcessFlow,{ lanes:lanes, steps:steps, edges:edges, label:'AI-native engagement process from request to value review.' }));
</script>
</body>
</html>
