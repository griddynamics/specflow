<!doctype html>
<html>
<head><meta charset="utf-8"><title>QuestionBlock — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class="gdg-root gdg-scene" style="padding:24px;min-height:800px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

ReactDOM.createRoot(document.getElementById('root')).render(h(G.GlassSurface,{variant:'strong',style:{padding:24,maxWidth:680}},
  h(G.QuestionBlock,{number:'Q1', question:'Should guest access expire automatically?', help:'The spec mentions 90 days but no renewal flow.', type:'yesno', defaultValue:'yes'}),
  h(G.QuestionBlock,{number:'Q2', question:'Which identity provider do partner organisations use?', options:[{value:'a',label:'Client Azure AD (B2B guests)'},{value:'b',label:'Each partner\'s own IdP via OIDC'},{value:'c',label:'Email magic links'}], allowOther:true}),
  h(G.QuestionBlock,{number:'Q3', question:'Attach the signed data-processing agreement', type:'upload', defaultCommentOpen:true})));
</script>
</body>
</html>
