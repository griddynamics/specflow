<!doctype html>
<html>
<head><meta charset="utf-8"><title>SelectionToolbar — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class="gdg-root gdg-wash" style="padding:0;min-height:260px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

function Demo(){ var ref=React.useRef(null); var s=G.useTextSelection(ref), sel=s[0];
  return h('div',{ref:ref, style:{position:'relative', padding:'56px 24px 24px'}},
    h(G.Prose,{paper:true, html:'<p>Guests sign in through the client identity provider. <mark>Guests can read published specs and comment, but cannot see cost estimates.</mark> Access expires after 90 days.</p><p>Select any text to move the toolbar.</p>'}),
    h(G.SelectionToolbar, sel ? {x:sel.x, y:sel.y} : {x:470, y:96})); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
