<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl — preview</title><style>html,body{margin:0}</style></head>
<body>
<div class="gdg-root gdg-wash" style="padding:24px" id="root"></div>
<script>
  var G = window.GDGlass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(G.SegmentedControl,{label:'Period', options:[{value:'w',label:'Week'},{value:'m',label:'Month'},{value:'q',label:'Quarter'},{value:'y',label:'Year'}], defaultValue:'m'}));
</script>
</body>
</html>
