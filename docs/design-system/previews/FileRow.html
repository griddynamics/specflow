<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileRow — GD Liquid Glass</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--ground)}</style>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<script src="../components/lib/react.production.min.js"></script>
<script src="../components/lib/react-dom.production.min.js"></script>
<script src="../components/lib/jsx-runtime-shim.js"></script>
<script src="../components/lib/xyflow-react.umd.js"></script>
<script src="../components/bundle.js"></script>
</head>
<body>
<div class="gdg-root gdg-scene" style="padding:24px;min-height:360px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gap:8,maxWidth:640}},
  h(G.FileRow,{name:'access-control.md', size:18432, status:'ready', onRemove:function(){}}),
  h(G.FileRow,{name:'checkout-flow.md', size:40960, status:'uploading', progress:64}),
  h(G.FileRow,{name:'data-model.md', size:9216, status:'processing'}),
  h(G.FileRow,{name:'integrations.md', size:22528, status:'done'}),
  h(G.FileRow,{name:'legacy-notes.docx', size:3145728, status:'error', errorText:'Too large', onRemove:function(){}})));
</script>
</body>
</html>
