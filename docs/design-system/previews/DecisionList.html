<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DecisionList — GD Liquid Glass</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--ground)}</style>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<script src="../components/lib/react.production.min.js"></script>
<script src="../components/lib/react-dom.production.min.js"></script>
<script src="../components/lib/jsx-runtime-shim.js"></script>
<script src="../components/lib/xyflow-react.umd.js"></script>
<script src="../components/bundle.js"></script>
</head>
<body>
<div class="gdg-root gdg-scene" style="padding:24px;min-height:470px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gap:16}},
  h('div',{className:'gdg-filters'}, h(G.Switch,{label:'Open', defaultChecked:true}), h(G.Switch,{label:'Assigned to me'}),
    h(G.Select,{options:[{value:'all',label:'All domains'},{value:'sec',label:'Security'}], defaultValue:'all', icon:'funnel-simple'}),
    h(G.SegmentedControl,{label:'Severity', options:[{value:'all',label:'All'},{value:'critical',label:'Critical'},{value:'high',label:'High'},{value:'medium',label:'Medium'},{value:'low',label:'Low'}], defaultValue:'all'})),
  h(G.DecisionList,{footer:'4 of 28 decisions'},
    h(G.DecisionRow,{title:'External user permissions', subtitle:'2 questions · access-control.md', domain:'Security', severity:'critical', assignee:'Sam Carter'}),
    h(G.DecisionRow,{title:'Order event retention period', subtitle:'1 question · data-model.md', domain:'Data', severity:'high', assignee:'Alex Rivera'}),
    h(G.DecisionRow,{title:'Guest onboarding email copy', subtitle:'1 question · onboarding.md', domain:'UX', severity:'medium', assignee:'Nina Walker'}),
    h(G.DecisionRow,{title:'Salesforce sync frequency', subtitle:'1 question · salesforce.md', domain:'Integrations', severity:'low'}))));
</script>
</body>
</html>
