<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConnectorCard — GD Liquid Glass</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--ground)}</style>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<script src="../components/lib/react.production.min.js"></script>
<script src="../components/lib/react-dom.production.min.js"></script>
<script src="../components/lib/jsx-runtime-shim.js"></script>
<script src="../components/lib/xyflow-react.umd.js"></script>
<script src="../components/bundle.js"></script>
</head>
<body>
<div class="gdg-root gdg-scene" style="padding:24px;min-height:420px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:20}},
  h(G.ConnectorCard,{name:'GitHub', category:'Code', description:'Read repositories, pull requests and ADRs.', status:'connected', meta:'3 repositories'}),
  h(G.ConnectorCard,{name:'Google Drive', category:'Documents', description:'Import specs and meeting notes from shared folders.', status:'attention', meta:'Token expires in 2 days'}),
  h(G.ConnectorCard,{name:'Jira', category:'Delivery', description:'Link decisions to epics and stories.', status:'connected', meta:'Organisation'}),
  h(G.ConnectorCard,{name:'Slack', category:'Communication', description:'Post decision digests to project channels.', status:'off'})));
</script>
</body>
</html>
