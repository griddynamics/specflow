<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast — GD Liquid Glass</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--ground)}</style>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<script src="../components/lib/react.production.min.js"></script>
<script src="../components/lib/react-dom.production.min.js"></script>
<script src="../components/lib/jsx-runtime-shim.js"></script>
<script src="../components/lib/xyflow-react.umd.js"></script>
<script src="../components/bundle.js"></script>
</head>
<body>
<div class="gdg-root gdg-scene" style="padding:24px;min-height:260px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gap:10,maxWidth:380}},
  h(G.Toast,{tone:'success', title:'Answers submitted', message:'Natalia will review them today.', onClose:function(){}}),
  h(G.Toast,{tone:'info', title:'Not available in this demo', message:'The connection wizard ships later.', onClose:function(){}}),
  h(G.Toast,{tone:'danger', title:'No access to Google Drive', message:'Share the folder with the GD service account.', onClose:function(){}})));
</script>
</body>
</html>
