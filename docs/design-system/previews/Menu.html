<html lang="en">
<head>

<title>Menu — GD Liquid Glass</title>

<style>html,body{margin:0;background:var(--ground)}</style>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<script src="../components/lib/react.production.min.js"></script>

<body>
<div class="gdg-root gdg-wash" style="padding:24px;min-height:300px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'flex',gap:24}},
  h(G.Menu,{label:'Project', defaultOpen:true, trigger:'Atlas', items:[{section:'Projects'},{label:'Atlas',description:'Processed · 42 files',checked:true},{label:'Checkout revamp',description:'Processing',checked:false},{divider:true},{label:'New project',icon:'plus'}]}),
  h('div',{style:{marginLeft:300}}, h(G.Menu,{label:'Row actions', align:'start', trigger:h(G.Icon,{name:'dots-three',size:18}), items:[{label:'Open',icon:'arrow-square-out'},{label:'Assign',icon:'users'},{divider:true},{label:'Delete',icon:'x',tone:'danger'}]}))));
</script>
