<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkField — GD Liquid Glass</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;background:var(--ground)}</style>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();</script>
<script src="../components/lib/react.production.min.js"></script>
<script src="../components/lib/react-dom.production.min.js"></script>
<script src="../components/lib/jsx-runtime-shim.js"></script>
<script src="../components/lib/xyflow-react.umd.js"></script>
<script src="../components/bundle.js"></script>
</head>
<body>
<div class="gdg-root gdg-scene" style="padding:24px;min-height:300px;box-sizing:border-box;" id="root"></div>
<script>
var G = window.GDGlass, h = React.createElement;
var PEOPLE = [
  { id:'mk', name:'Sam Carter', role:'Product owner', email:'scarter@example.com' },
  { id:'ak', name:'Alex Rivera', role:'Engineer', email:'arivera@example.com' },
  { id:'nc', name:'Nina Walker', role:'Delivery manager', email:'nwalker@example.com' }];

function Demo(){ return h(G.GlassSurface,{variant:'strong', style:{padding:24, maxWidth:620, display:'grid', gap:12}},
  h(G.LinkField,{label:'GitHub repository', icon:'git-branch', placeholder:'https://github.com/org/repo', defaultValue:'https://github.com/acme/atlas-api', defaultStatus:'ok'}),
  h(G.LinkField,{label:'Google Drive folder', icon:'folder-simple', placeholder:'https://drive.google.com/…', defaultValue:'https://drive.google.com/private/specs', defaultStatus:'fail'}),
  h(G.LinkField,{label:'Second repository', icon:'git-branch', placeholder:'https://github.com/org/repo', help:'Press Enter or Test access.', onRemove:function(){}})); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
