<title>Graphico Integrations</title>
<meta name="description" content="Prototype: connect each app once per project, then use it at every stage: the graph, the gaps and the plan.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<header class="site-header mc-head">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Graphico home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5" fill="currentColor"/><path d="M7 7.5 L17 12 L7 16.5" fill="none" stroke="var(--paper)" stroke-width="1.6"/><circle cx="7" cy="7.5" r="2.1" fill="var(--paper)"/><circle cx="17" cy="12" r="2.1" fill="var(--paper)"/><circle cx="7" cy="16.5" r="2.1" fill="var(--paper)"/></svg>
      <span class="brand-name">Graphico</span>
    </a>
    <span class="crumb"><button class="proj" type="button">Northwind ordering<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button></span>
    <nav class="head-nav" aria-label="App">
      <a href="index.html">Mission Control</a>
      <button class="nav-btn" type="button" id="members-open" aria-haspopup="dialog">Members</button>
      <a href="integrations.html" aria-current="page">Integrations</a>
      <button class="theme-btn" type="button" data-theme-toggle aria-label="Switch to dark mode"><svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.6A6.6 6.6 0 0 1 7.4 4a6.6 6.6 0 1 0 8.6 8.6z"/></svg><svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6"/></svg></button>
      <span class="avatar" aria-label="Your account">AK</span>
    </nav>
  </div>
</header>

<main class="ig">
  <div class="intro">
    <h1 class="h2">Connect each app once. Use it at every stage.</h1>
    <p class="lede">Connect an app here, then add what you need on the canvas.</p>
  </div>

  <ul class="ig-grid" id="ig-grid" aria-label="Integrations"></ul>

  <section class="ig-builtin" aria-labelledby="ig-builtin-t">
    <p class="eyebrow" id="ig-builtin-t">Built in · always on</p>
    <ul class="ig-mini">
      <li><span class="ig-mini-ic" aria-hidden="true"><svg class="glyph" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 14v5h16v-5"/></svg></span><b>Upload, Google Drive, Obsidian</b><small>Added with the plus on the canvas.</small></li>
      <li><span class="ig-mini-ic" aria-hidden="true" id="ig-mcp-ic"></span><b>MCP</b><small>Added to the canvas by itself.</small></li>
    </ul>
  </section>
</main>

<dialog class="mdl" id="mdl" aria-labelledby="mdl-title">
  <div class="mdl-in" id="mdl-in"></div>
</dialog>

<script src="landing.js"></script>
<script src="icons.js"></script>
<script src="members.js"></script>
<script src="integrations.js"></script>
