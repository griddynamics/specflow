# The settings `archkit run` passes with `-c`, so the adopter's own pytest configuration
# never changes how the bundled checks behave. Add warning filters with
# `[archkit] filterwarnings` in archkit.toml, never here.
[pytest]
addopts = --strict-markers --strict-config -ra -p no:cacheprovider
xfail_strict = true
filterwarnings =
    error
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
