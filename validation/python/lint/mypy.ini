# Strict mypy configuration. Use: `mypy --config-file mypy.ini <files or packages>`.
# An unused or code-less `# type: ignore` is itself a finding.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True
show_error_codes = True
show_column_numbers = True
pretty = False
local_partial_types = True
explicit_package_bases = True
enable_error_code =
    ignore-without-code,
    redundant-expr,
    redundant-self,
    truthy-bool,
    truthy-iterable,
    possibly-undefined,
    unused-awaitable,
    explicit-override,
    mutable-override,
    exhaustive-match,
    deprecated
# The kit's deliberate-violation fixtures and its sample project (whose `src` package would
# otherwise collide with the project's own when the kit sits inside the scanned tree).
# project: backend/tests is a flat folder of untyped modules (1470 untyped defs, 741 untyped
# calls, bare-name imports of its *_support helpers, a tests/drive folder that shadows the `drive`
# package) and mypy cannot relax strictness by module-name pattern. It is excluded here; src/,
# examples/ and migrations/ stay strict. Revisit when the tests get annotations.
exclude = (^|/)(semgrep/fixtures|examples/clean_project)/|(^|/)tests/
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

# boto3 and botocore ship no type information; the `aws` extra adds no stubs package (no new
# dependency). Only storage/s3.py imports them, behind the storage factory.
[mypy-boto3.*,botocore.*]
ignore_missing_imports = True
