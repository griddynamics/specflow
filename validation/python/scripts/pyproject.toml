[project]
name = "pystatic"
version = "0.2.0"
description = "Project-agnostic static validation scripts for Python repositories."
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "markdown-it-py[linkify]==4.2.0",
    "pyyaml==6.0.3",
    # `json-schemas` runs the `check-jsonschema` command this installs.
    "check-jsonschema==0.38.0",
]

[project.optional-dependencies]
# `pystatic.style`: the pylint (length limits) and vulture (dead code) adapters.
style = [
    "pylint==4.1.3",
    "vulture==2.16",
]
# `pystatic.harness.collected_docs`: a helper a project's own pytest session imports.
pytest = [
    "pytest==9.1.1",
]

# `file-size` page budget (`page-paths`): counts PDF pages and PPTX slides.
pages = [
    "pypdf==6.21.1",
    "python-pptx==1.0.2",
]

[dependency-groups]
dev = [
    "pylint==4.1.3",
    "vulture==2.16",
    "pytest==9.1.1",
    "pypdf==6.21.1",
    "python-pptx==1.0.2",
    "pytest-cov==7.1.0",
    # `package-data` builds the target's wheel with `uv build --no-build-isolation`.
    "hatchling==1.32.4",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "deptry==0.25.1",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pystatic"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["pystatic"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = ["-p", "no:cacheprovider", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pystatic"]
branch = true
omit = ["pystatic/**/fixtures/**"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# `pystatic.style.dead_code` over the kit itself: production code owns its findings and
# tests only supply usage; tests are a second scope that production code feeds.
[[tool.dead-code.scopes]]
sources = ["pystatic/**/*.py"]
exclude = ["pystatic/**/test_*.py", "pystatic/conftest.py", "pystatic/**/fixtures/**/*.py"]
consumers = ["pystatic/**/test_*.py", "pystatic/conftest.py"]

[[tool.dead-code.scopes]]
sources = ["pystatic/**/test_*.py", "pystatic/conftest.py"]
consumers = ["pystatic/**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["pystatic/**/fixtures/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# PEP 695 `type` aliases are refused by length-limits; TypeAliasType is the spelling.
ignore = ["UP040"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["/fixtures/"]
plugins = ["pydantic.mypy"]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# The pylint/vulture APIs ship no type information.
[[tool.mypy.overrides]]
module = ["pylint.*", "vulture", "vulture.*"]
ignore_missing_imports = true

[tool.deptry]
extend_exclude = ["(^|.*/)(test_[^/]+|conftest)\\.py$", "(^|.*/)fixtures/"]

[tool.deptry.per_rule_ignores]
# Used as a command (`check-jsonschema`), never imported.
DEP002 = ["check-jsonschema"]
