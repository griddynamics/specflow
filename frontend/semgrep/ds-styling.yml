# Layout belongs to CSS: elements are placed and sized by the stylesheet, not by measuring the DOM
# and writing the result back.
#
# Generated by scripts/build-ds-rules.mjs from templates/ds-styling.yml.tmpl and a design-system
# facts file (design-system.example.json); edit the facts file and rebuild instead of editing this
# file. Facts read: geometryModules.
rules:
  - id: styling-layout-measurement
    message: >-
      `ResizeObserver` or `getBoundingClientRect` measures the DOM for layout. Place and size
      elements with CSS (grid, flex, `clamp()`, container queries) rather than measuring and
      writing the result back into state or style. A module whose job is geometry CSS cannot
      state (a canvas, a popover's viewport fit, a text-truncation check) is listed in the
      `geometryModules` fact of the design-system facts file.
    severity: ERROR
    languages:
      - typescript
    paths:
      exclude:
        - "**/*.test.ts"
        # Playwright specs and their support code run in the browser harness, not in the product UI: they read geometry, focus and the URL on purpose to assert on them.
        - "**/e2e/**"
        - "**/e2e-production/**"
        - "**/*.test.tsx"
        - "**/lib/theme.ts"
        # Geometry modules (the `geometryModules` fact): each places something CSS cannot state, a popover's viewport fit,
        # a selection toolbar anchored to a text range, scroll-to-heading offsets, and the sliding lens under the active segment.
        - "**/components/ui/MentionInput.tsx"
        - "**/components/ui/use-text-selection.ts"
        - "**/components/ui/SegmentedControl.tsx"
        - "**/lib/markdown/scroll.ts"
    pattern-either:
      - pattern: new ResizeObserver(...)
      - pattern: $EL.getBoundingClientRect()
