# Design system: a breadcrumb derives from the route tree, or it does not exist.
#
# Generated by scripts/build-ds-rules.mjs from templates/ds-navigation.yml.tmpl and a design-system
# facts file (design-system.example.json); edit the facts file and rebuild instead of editing this
# file. Facts read: breadcrumbFile, the one breadcrumb component, which derives the root, section
# and current-page labels from the router, and routeHelperFiles, the router and route-matching
# helpers that may read the pathname (excluded from `ds-no-pathname-label-sniffing`).
rules:
  # 1. The breadcrumb landmark itself, assembled anywhere but the breadcrumb module.
  - id: ds-no-hand-written-breadcrumb-nav
    message: >-
      Hand-written breadcrumb markup (an element labelled "breadcrumb") outside the breadcrumb
      component. A breadcrumb derives from the route tree rather than being assembled by hand:
      render the breadcrumb component, which derives the labels from the router, and pass only
      the entity name on a detail route.
    severity: ERROR
    languages:
      - typescript
    paths:
      exclude:
        - "**/*.test.tsx"
        - "**/*.test.ts"
        - "**/components/ui/Breadcrumbs.tsx"
    pattern-either:
      - pattern: <$EL ... aria-label="=~/(?i)breadcrumb/" ...>...</$EL>
      - pattern: <$EL ... aria-label="=~/(?i)breadcrumb/" ... />
      - pattern: <$EL ... aria-label={$T("=~/(?i)breadcrumb/",...)} ...>...</$EL>
      - pattern: <$EL ... aria-label={$T("=~/(?i)breadcrumb/",...)} ... />

  # 2. The last crumb of a hand-assembled trail. A navigation link marks the active route
  #    conditionally (`aria-current={active ? 'page' : undefined}`) and is untouched; a literal
  #    `aria-current="page"` is an element that is always the current page, which only a
  #    breadcrumb trail renders.
  - id: ds-no-hand-written-breadcrumb-trail
    message: >-
      A literal `aria-current="page"` is the last crumb of a hand-assembled breadcrumb trail.
      Render the breadcrumb component, which derives the current-page label from the router. (An
      active navigation link uses the conditional form `aria-current={active ? 'page' :
      undefined}` and is not this.)
    severity: ERROR
    languages:
      - typescript
    paths:
      exclude:
        - "**/*.test.tsx"
        - "**/*.test.ts"
        - "**/components/ui/Breadcrumbs.tsx"
    pattern-either:
      - pattern: <$EL ... aria-current="page" ...>...</$EL>
      - pattern: <$EL ... aria-current="page" ... />

  # 3. The crumb separator chain: a decorative separator glyph rendered as a list item, or as an
  #    aria-hidden element inside a `<nav>`. The aria-hidden arm is scoped to a `<nav>` so that a
  #    decorative separator elsewhere keeps a conforming form (`a11y-decorative-separator-not-hidden`
  #    requires `aria-hidden` on it).
  - id: ds-no-breadcrumb-separator-chain
    message: >-
      A decorative separator glyph ("/", "›", "→", "»", "▸") rendered as a list item or as an
      aria-hidden element in a nav is a hand-assembled crumb chain. Render the breadcrumb
      component and let it derive the trail from the route tree.
    severity: ERROR
    languages:
      - typescript
    paths:
      exclude:
        - "**/*.test.tsx"
        - "**/components/ui/Breadcrumbs.tsx"
    pattern-either:
      - pattern-regex: '(?s)<li\b[^>]*>\s*[/›→»▸]\s*</li>'
      - patterns:
          - pattern-inside: <nav ...>...</nav>
          - pattern-regex: '(?s)<[A-Za-z][\w.]*\b[^>]*\baria-hidden\b[^>]*>\s*[/›→»▸]\s*</[A-Za-z][\w.]*>'

  # 4. A crumb label handed in from outside instead of derived. A member typed ReactNode /
  #    ReactElement is a slot that receives the derived breadcrumb element and is not this.
  - id: ds-no-breadcrumb-label-prop
    message: >-
      A breadcrumb label handed in as a prop, or held in a local `breadcrumb` binding: a
      breadcrumb derives from the route tree rather than being passed by hand. Drop it and render
      the breadcrumb component; a detail route passes only the entity name.
    severity: ERROR
    languages:
      - typescript
    paths:
      exclude:
        - "**/*.test.tsx"
        - "**/*.test.ts"
        - "**/components/ui/Breadcrumbs.tsx"
    pattern-either:
      - patterns:
          - pattern-regex: '(?m)^[ \t]*(readonly[ \t]+)?[Bb]readcrumbs?[A-Za-z0-9_]*[ \t]*\??[ \t]*:'
          - pattern-not-regex: '(?m)^[ \t]*(readonly[ \t]+)?[Bb]readcrumbs?[A-Za-z0-9_]*[ \t]*\??[ \t]*:[ \t]*(React\.)?(ReactNode|ReactElement|JSX\.Element)[ \t]*;?[ \t]*$'
      - patterns:
          - pattern-regex: '(?m)^[ \t]*((const|let|var)[ \t]+)?[Bb]readcrumbs?[A-Za-z0-9_]*[ \t]*=[^=]'
          - pattern-not-regex: '(?m)^[ \t]*[Bb]readcrumbs?[A-Za-z0-9_]*=\{'
      - patterns:
          - pattern-either:
              - pattern: <$EL ... $PROP=$V ...>...</$EL>
              - pattern: <$EL ... $PROP=$V ... />
          - metavariable-regex:
              metavariable: $PROP
              regex: "^[Bb]readcrumbs?[A-Za-z0-9_]*$"
          - metavariable-pattern:
              metavariable: $V
              patterns:
                - pattern-not: <$C ...>...</$C>
                - pattern-not: <$C ... />

  # 5. Deciding what to display by sniffing the pathname as a string.
  - id: ds-no-pathname-label-sniffing
    message: >-
      Deciding what to display by substring-matching the pathname is a hand-made breadcrumb. The
      route tree is the source of truth: take route identity from the typed router (its matches
      and params), and render the breadcrumb component for the trail.
    severity: ERROR
    languages:
      - typescript
    paths:
      exclude:
        - "**/*.test.tsx"
        - "**/*.test.ts"
        # Playwright specs and their support code run in the browser harness, not in the product UI: they read geometry, focus and the URL on purpose to assert on them.
        - "**/e2e/**"
        - "**/e2e-production/**"
        - "**/components/ui/Breadcrumbs.tsx"
        - "**/lib/routes.ts"
    patterns:
      - pattern-either:
          - pattern: $P.includes(...)
          - pattern: $P.split(...)
          - pattern: $P.startsWith(...)
          - pattern: $P.endsWith(...)
          - pattern: $P.indexOf(...)
          - pattern: $P.match(...)
          - pattern: $P.slice(...)
          - pattern: $P.substring(...)
          - pattern: $P.lastIndexOf(...)
      - metavariable-regex:
          metavariable: $P
          # A form field address (`lines.0.items.1.value`) is not a URL.
          regex: '^(?!([\w$]+\.)*fieldPath$)(?:([\w$]+\.)*[a-z][\w$]*[Pp]ath(name|Name)?|([\w$]+\.)*path(name)?)$'
