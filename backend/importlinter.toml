# Import contracts of the backend, read by validation/python/lint (IMPORTLINTER_CONFIG).
# Run from backend/ with PYTHONPATH=src: src/ is the import root and every top-level package
# is a root package (there is no single `src` package). `make validate-python` sets both.
# Replaces validation/python/lint/importlinter.toml, whose `src.<feature>` layout does not exist here.
# Facts behind the contracts: backend/src (checked with grimp when written).
[tool.importlinter]
root_packages = [
    "agent_contracts",
    "agent_runtime",
    "api",
    "auth",
    "db",
    "drive",
    "file_parsers",
    "graph",
    "llm",
    "logger",
    "mcp_server",
    "postgres",
    "storage",
    "temporal",
]
include_external_packages = true

# The central logger (backend/AGENTS.md) is the base of the tree: it
# imports no other project package, so any package can use it without a cycle.
[[tool.importlinter.contracts]]
name = "The logger imports no project package"
id = "logger-is-base"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["logger"]
forbidden_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "llm", "mcp_server", "postgres", "storage",
    "temporal",
]

# The shared PostgreSQL access (engines and connection transactions of the application database and the
# PostgreSQL graph store) sits on SQLAlchemy alone, so the host and the graph library can both use it.
[[tool.importlinter.contracts]]
name = "The shared PostgreSQL access imports no project package"
id = "postgres-is-base"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["postgres"]
forbidden_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "llm", "logger", "mcp_server", "storage",
    "temporal",
]

# api is the outermost layer (HTTP). Nothing below it reaches back into it.
[[tool.importlinter.contracts]]
name = "Nothing imports the API layer"
id = "api-is-outermost"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agent_contracts", "agent_runtime", "auth", "db", "drive", "file_parsers", "graph", "llm", "logger", "postgres",
    "storage", "temporal",
]
forbidden_modules = ["api"]

# The shared agent contracts (docs/mcp-server/architecture.md#package-layout) are pure pydantic over the public
# models of graph.plan: no other project package, no web framework, ORM, driver or HTTP client.
[[tool.importlinter.contracts]]
name = "The agent contracts import only pydantic and the public graph.plan models"
id = "agent-contracts-pure"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["agent_contracts"]
forbidden_modules = [
    "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "llm", "logger", "mcp_server", "postgres", "storage",
    "temporal", "graph.build", "graph.core", "graph.gap", "graph.stores", "fastapi", "starlette", "sqlalchemy", "asyncpg", "neo4j",
    "httpx",
]

# The graph package (Neo4j knowledge graph) depends on the logger and nothing else
# of ours; the service wires it in from api and temporal.
[[tool.importlinter.contracts]]
name = "The graph package stands alone"
id = "graph-standalone"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["graph"]
forbidden_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "llm", "mcp_server", "storage", "temporal",
]

# graph.build sits on graph.core; the core never imports the build pipeline, the gap detector
# or the planner.
[[tool.importlinter.contracts]]
name = "Graph core does not depend on its callers"
id = "graph-core-lowest"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["graph.core"]
forbidden_modules = ["graph.build", "graph.gap", "graph.plan"]

# graph.plan reads only graph.core. It never reaches the build pipeline or the gap detector, whose
# results arrive through host-converted models. Build likewise never depends on the planner.
[[tool.importlinter.contracts]]
name = "Graph submodules are independent"
id = "graph-submodules-independent"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["graph.plan", "graph.build"]
forbidden_modules = ["graph.build", "graph.plan", "graph.gap"]

# graph.stores imports graph.core, so graph.core reaches back into graph.stores only from the compatibility
# shims (``db``, ``schema``, which resolve their names lazily) and from the one deprecated driver path of
# ``store`` (imported late). Anything else would make importing the core load a store, and with it the SDK.
[[tool.importlinter.contracts]]
name = "Graph core imports the stores only from its shims"
id = "graph-core-stores-from-shims"
type = "forbidden"
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
source_modules = ["graph.core"]
forbidden_modules = ["graph.stores"]
ignore_imports = [
    "graph.core.db -> graph.stores.**",
    "graph.core.schema -> graph.stores.**",
    "graph.core.store -> graph.stores.neo4j",
]

# Provider and integration packages are reusable on their own: they know neither the database,
# the workflow engine nor the HTTP layer.
[[tool.importlinter.contracts]]
name = "Integration packages do not know the service layers"
id = "integrations-standalone"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["auth", "drive", "llm", "storage", "file_parsers"]
forbidden_modules = ["api", "db", "temporal", "agent_runtime", "agent_contracts", "graph", "mcp_server"]

# Vendor SDKs stay in the package that owns the integration.
[[tool.importlinter.contracts]]
name = "Neo4j is confined to graph"
id = "graph-sdk-confined"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "llm", "logger", "mcp_server", "storage",
    "temporal",
]
forbidden_modules = ["neo4j"]

[[tool.importlinter.contracts]]
name = "Claude Agent SDK and Langfuse are confined to llm"
id = "llm-sdk-confined"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "logger", "mcp_server", "storage",
    "temporal",
]
forbidden_modules = ["claude_agent_sdk", "langfuse"]

[[tool.importlinter.contracts]]
name = "The web framework belongs to api, auth and mcp_server"
id = "web-framework-confined"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agent_contracts", "agent_runtime", "db", "drive", "file_parsers", "graph", "llm", "logger", "storage", "temporal",
]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "The ORM stays in api, db and temporal"
id = "orm-confined"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["agent_contracts", "agent_runtime", "auth", "drive", "file_parsers", "llm", "logger", "storage"]
forbidden_modules = ["sqlalchemy", "asyncpg", "alembic"]

# Inside graph, each graph store SDK stays in the folders of the adapters that use it (design D3). The
# ignore lists are the allowances; a folder that does not exist yet (its adapter is not shipped) is
# not an error. The same names are confined per module path by tests/test_graph_structure.py.
[[tool.importlinter.contracts]]
name = "The Neo4j SDK stays in the Bolt-speaking graph stores"
id = "graph-neo4j-sdk-confined"
type = "forbidden"
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
source_modules = ["graph"]
forbidden_modules = ["neo4j"]
ignore_imports = [
    "graph.stores._bolt -> neo4j",
    "graph.stores._bolt.** -> neo4j",
    "graph.stores.neo4j -> neo4j",
    "graph.stores.neo4j.** -> neo4j",
    "graph.stores.arcadedb -> neo4j",
    "graph.stores.arcadedb.** -> neo4j",
]

[[tool.importlinter.contracts]]
name = "The SQL SDKs stay in the PostgreSQL graph store"
id = "graph-sql-sdk-confined"
type = "forbidden"
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
source_modules = ["graph"]
forbidden_modules = ["sqlalchemy", "asyncpg", "alembic", "postgres"]
ignore_imports = [
    "graph.stores.postgres -> sqlalchemy",
    "graph.stores.postgres.** -> sqlalchemy",
    "graph.stores.postgres -> asyncpg",
    "graph.stores.postgres.** -> asyncpg",
    "graph.stores.postgres -> postgres",
    "graph.stores.postgres.** -> postgres",
]

# httpx (the ArcadeDB admin API) and pyTigerGraph (the `tigergraph` extra) belong to one adapter each.
[[tool.importlinter.contracts]]
name = "httpx is used by the ArcadeDB graph store and the MCP API client only"
id = "httpx-confined"
type = "forbidden"
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
source_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "llm", "logger", "mcp_server", "storage",
    "temporal",
]
forbidden_modules = ["httpx"]
ignore_imports = [
    "graph.stores.arcadedb -> httpx",
    "graph.stores.arcadedb.** -> httpx",
    "mcp_server.api_client -> httpx",
]

[[tool.importlinter.contracts]]
name = "pyTigerGraph is used by the TigerGraph graph store only"
id = "tigergraph-sdk-confined"
type = "forbidden"
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
source_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "llm", "logger", "mcp_server", "storage",
    "temporal",
]
forbidden_modules = ["pyTigerGraph"]
ignore_imports = [
    "graph.stores.tigergraph -> pyTigerGraph",
    "graph.stores.tigergraph.** -> pyTigerGraph",
]

# Production code reaches no test module and no test-only library, directly or indirectly.
[[tool.importlinter.contracts]]
name = "No test code in production"
id = "no-test-imports"
type = "forbidden"
source_modules = [
    "agent_contracts", "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "llm", "logger", "mcp_server", "storage",
    "temporal",
]
forbidden_modules = ["pytest", "_pytest"]

# The MCP role (mcp_server, docs/mcp-server/architecture.md#import-rules) is a sibling of the REST
# app, a top-level package of its own: it shares no REST module and loads no FastAPI (M2), and the REST
# modules load neither it nor the MCP SDK.
[[tool.importlinter.contracts]]
name = "The MCP role uses no REST module, no FastAPI and no data package"
id = "mcp-role-isolated"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["mcp_server"]
forbidden_modules = [
    "fastapi", "auth.dependencies", "db", "graph", "temporal", "storage", "llm", "drive", "agent_runtime", "health", "api",
]

[[tool.importlinter.contracts]]
name = "The REST app imports neither the MCP role nor the MCP SDK"
id = "rest-without-mcp"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["api"]
forbidden_modules = ["mcp_server", "mcp", "mcp_types"]

# M2: the MCP role imports no data driver (it reads through the API).
[[tool.importlinter.contracts]]
name = "The MCP role imports no data driver"
id = "mcp-no-data-drivers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["mcp_server"]
forbidden_modules = ["sqlalchemy", "asyncpg", "neo4j"]

# Connections are opened in the composition roots only: the REST runtime and the Temporal worker registrations build
# the engine (db.session) and the graph store (graph.stores) and hand them on. Everything else reaches Postgres
# through db.repositories and the graph through the graph and plan libraries (GraphReader, PlanReader,
# PlanService), never through a store or an engine of its own. The MCP role has no connection: it calls the API.
[[tool.importlinter.contracts]]
name = "Only the composition roots open a database or a graph store"
id = "connections-in-composition-roots"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agent_runtime", "api", "auth", "drive", "file_parsers", "graph.build", "graph.gap", "graph.plan", "llm", "mcp_server",
    "storage", "temporal",
]
forbidden_modules = ["db.session", "graph.stores", "postgres"]
ignore_imports = [
    "api.runtime -> db.session",
    "api.runtime -> graph.stores",
    "temporal.agents.registration -> db.session",
    "temporal.documents.registration -> db.session",
]
