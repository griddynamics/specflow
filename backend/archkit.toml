    { name = "probe-117", class = "api.errors:ApiError", args = [422, "dropbox_link_invalid", "The link is not a Dropbox folder or file link. Paste the shared link or the address of one folder or file."] },
    { name = "probe-118", class = "api.errors:ApiError", args = [409, "dropbox_no_access", "The Dropbox account of the member who connected Dropbox cannot read this folder or file. Add it to that Dropbox first."] },
    { class = "builtins:RuntimeError", args = ["unexpected"] },
]

[error_exposure]
unknown_path = "/api/v1/this-route-does-not-exist"
method_not_allowed = "DELETE /api/v1/me"

[request_id]
header = "X-Request-Id"
ok_path = "/healthz"
unknown_path = "/api/v1/this-route-does-not-exist"
method_not_allowed = "DELETE /api/v1/me"
unauthenticated_path = "/api/v1/me"

[route_contract]
public_operations = ["GET /healthz", "GET /readyz", "POST /api/v1/integrations/linear/webhook"]
create_operation_prefix = "create_"

[openapi_snapshot]
path = "contracts/openapi.json"
regenerate = "cd backend && uv run --frozen --with-editable ../validation/python/arch python -m archkit export-openapi --config archkit.toml"
