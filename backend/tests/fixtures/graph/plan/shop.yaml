# The synthetic spec graph used by offline graph.plan tests.
#
# Names mirror the acceptance cases of the plan tests. Nodes, edges,
# documents and fragments are deliberately small: the fixture is reader input, not a build corpus.

build_id: build-1

documents:
  - document_id: shop
    spec_id: DOC::SHOP
    revision_id: REV::SHOP
    version: 1
    path: docs/shop.md
    title: Shop requirements
    status: active
    last_build_id: build-1

fragments:
  - fragment_id: shop.intro
    document_id: shop
    spec_id: FRAG::SHOP_INTRO
    text: The shop consists of services, a datastore, a deployment target and an external provider.
    heading_path: [Shop requirements]
    ordinal: 1
    line_start: 1
    line_end: 1
    status: active
    last_build_id: build-1
  - fragment_id: shop.modules
    document_id: shop
    spec_id: FRAG::SHOP_MODULES
    text: Orders service, Payments service and Web shop are modules. Orders database stores data.
    heading_path: [Shop requirements, Modules]
    ordinal: 2
    line_start: 2
    line_end: 2
    status: active
    last_build_id: build-1
  - fragment_id: shop.interfaces
    document_id: shop
    spec_id: FRAG::SHOP_INTERFACES
    text: Orders API is provided by Orders service and consumed by Web shop. Stripe API is external.
    heading_path: [Shop requirements, Interfaces]
    ordinal: 3
    line_start: 3
    line_end: 3
    status: active
    last_build_id: build-1
  - fragment_id: shop.data
    document_id: shop
    spec_id: FRAG::SHOP_DATA
    text: Order is stored in Orders database and holds the fields an order needs.
    heading_path: [Shop requirements, Data]
    ordinal: 4
    line_start: 4
    line_end: 4
    status: active
    last_build_id: build-1
  - fragment_id: shop.features
    document_id: shop
    spec_id: FRAG::SHOP_FEATURES
    text: The shop has Place order, Order history export, Card payment, Checkout and nested features.
    heading_path: [Shop requirements, Features]
    ordinal: 5
    line_start: 5
    line_end: 5
    status: active
    last_build_id: build-1
  - fragment_id: shop.requirements
    document_id: shop
    spec_id: FRAG::SHOP_REQUIREMENTS
    text: Requirements name behaviour, data, integration, business rules and cross-area dependencies.
    heading_path: [Shop requirements, Requirements]
    ordinal: 6
    line_start: 6
    line_end: 6
    status: active
    last_build_id: build-1
  - fragment_id: shop.quality
    document_id: shop
    spec_id: FRAG::SHOP_QUALITY
    text: Checkout responds quickly and all services run in the EU region.
    heading_path: [Shop requirements, Quality]
    ordinal: 7
    line_start: 7
    line_end: 7
    status: active
    last_build_id: build-1
  - fragment_id: shop.constraints
    document_id: shop
    spec_id: FRAG::SHOP_CONSTRAINTS
    text: Stripe limits retries. Gift cards are out of scope for this release.
    heading_path: [Shop requirements, Constraints]
    ordinal: 8
    line_start: 8
    line_end: 8
    status: active
    last_build_id: build-1
  - fragment_id: shop.questions
    document_id: shop
    spec_id: FRAG::SHOP_QUESTIONS
    text: Which payment providers must the first release support?
    heading_path: [Shop requirements, Open questions]
    ordinal: 9
    line_start: 9
    line_end: 9
    status: active
    last_build_id: build-1

