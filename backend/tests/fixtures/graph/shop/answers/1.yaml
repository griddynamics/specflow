# The admin.md and orders.md CSV statements restate one commitment: same actor (staff users), same
# object (past orders, the order history), same format, slightly different words. Their name tokens
# differ too much for a direct merge (Jaccard below 0.7), so the small model is asked.
dedup:
  - pair: [Staff can download past orders as a CSV file, Staff can download the order history as a CSV file]
    same: true

# Embedding texts that share a vector: the two CSV statements' `name_embedding` texts. A real
# embedding model puts such restatements close (cosine >= 0.85 makes them dedup candidates); the
# scripted gateway's hash-seeded vectors are unrelated for any two different texts, so the pair is
# declared here. Every other text gets its own vector.
synonyms:
  - ["FunctionalRequirement: Staff can download past orders as a CSV file", "FunctionalRequirement: Staff can download the order history as a CSV file"]

# Nearness the edge catalogs rely on (build.md step 4: a foreign hub joins a unit's catalog by
# nearness only at cosine >= max(0.40, 0.8 x the fragment's best foreign hub)). A real embedding model
# puts these fragments near the hubs they talk about without naming them; hash-seeded vectors are
# nearly orthogonal, so the relations are declared and every other hub stays below the floor:
# - admin.md never names "Order history export", "Audit logging" or "Authentication" (FR-BLD-21);
# - the second orders.md unit ("Export details") does not name the feature either.
related:
  - anchor: "Feature: Order history export"
    cosine: 0.7
    fragments: [adm.finance, ord.details4, ord.details5]
  - anchor: "Capability: Audit logging"
    cosine: 0.6
    fragments: [adm.finance]
  - anchor: "Capability: Authentication"
    cosine: 0.7
    fragments: [adm.access]
