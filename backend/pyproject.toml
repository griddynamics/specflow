[project]
name = "specflow"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.1.0",
    "asyncpg>=0.32.0",
    "claude-agent-sdk==0.2.174",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "httplib2>=0.22",
    "httpx>=0.28.1",
    "langfuse>=4,<5",
    "mcp>=2.3,<3",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "openinference-instrumentation>=0.1.72",
    "openai>=3.37.0,<4",
    "openai-agents>=0.22.3,<0.23",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6",
    "starlette>=1.10.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "temporalio>=1.34,<2",
    "temporalio-openai-agents[openinference]>=1.1,<2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# One object-storage SDK per cloud, imported lazily by storage/factory.py. The images install both.
gcp = ["google-cloud-storage>=3.17.1"]
aws = ["boto3>=1.43,<2"]
# The TigerGraph graph store (GRAPH_STORE=tigergraph), imported lazily by graph/stores/tigergraph only.
tigergraph = ["pyTigerGraph==2.0.5"]
# The document parser (worker-parse image and dev/CI only; never the api or worker-agents image).
# Docling pin and set of format packages: docs/file-parsers/engines/docling.md, 'Packages'.
# opencv-python-headless: imported by docling_ibm_models (TableFormer v1) without being declared by docling-slim.
# docling-core, pypdfium2, defusedxml: imported directly by file_parsers (docling-core is also a dependency of docling-slim;
# defusedxml streams the XLSX sheets in file_parsers.office.guard with DTDs forbidden).
parse = [
    "docling-slim[convert-core,format-pdf,models-local,format-docx,format-pptx,format-xlsx,format-html,format-markdown]==2.145.0",
    "docling-core>=2.105,<3",
    "defusedxml>=0.7.1,<1",
    "opencv-python-headless<5",
    "pypdfium2",
    # scripts/fetch_docling_models.py and docker/worker-parse/Dockerfile download the models with it (docling-slim already needs it).
    "huggingface-hub",
    # CPU wheels only: the default PyPI Linux wheels of torch pull nvidia-* (CUDA) packages with proprietary terms.
    "torch==2.15.0",
    "torchvision",
]

[project.scripts]
specflow = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Linux resolves torch from the PyTorch CPU index; other platforms (macOS) use the default index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples", "."]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["S110"]

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
    "types-httplib2>=0.32.0.20260720",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

# deptry (validation/python/lint): src/ is the import root, so its packages are first party.
# Colocated test modules use the validation environment, not runtime imports.
[tool.deptry]
known_first_party = [
    "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "llm", "logger", "postgres", "storage",
    "temporal", "cli", "cloud_profile", "health", "settings",
    "example_lib", "graph_build", "mcp_qa_lib",  # examples/
    "graph_probes",  # tests/graph_probes: the store probes examples/graph_bench.py reads the graph through
]
extend_exclude = ["(^|.*/)(test_[^/]+|conftest)\\.py$"]

[tool.deptry.package_module_name_map]
docling-slim = ["docling"]
google-api-python-client = ["googleapiclient"]
google-auth = ["google"]
google-cloud-storage = ["google"]
openai-agents = ["agents"]
openinference-instrumentation = ["openinference"]

# asyncpg is the SQLAlchemy driver selected by the "postgresql+asyncpg" URL in src/settings.py
# and is never imported by name, so deptry cannot see its use.
[tool.deptry.per_rule_ignores]
# temporalio-openai-agents ships the temporalio.openai_agents module inside the temporalio namespace,
# which deptry attributes to the temporalio package.
# botocore ships inside the `aws` extra's boto3 (same release train); storage/s3.py imports its Config and ClientError.
# The MCP SDK client takes an `httpx2.AsyncClient` (httpx2 is a dependency of mcp 2.x); used by examples/mcp_qa_lib.py.
DEP001 = ["botocore", "httpx2"]
# The tigergraph extra is used by the graph store adapter when it ships. opencv-python-headless is imported by
# docling_ibm_models (TableFormer v1), not by our code; torch and torchvision are docling's runtime and pinned here
# only to select the CPU wheels.
DEP002 = [
    "asyncpg",
    "pyTigerGraph",
    "temporalio-openai-agents",
    "opencv-python-headless",
    "torch",
    "torchvision",
]
# examples/mcp_qa_lib.py catches anyio's BrokenResourceError/ClosedResourceError, which the MCP SDK client raises
# (anyio is a dependency of mcp).
DEP003 = ["anyio"]
# examples/mcp_qa_lib.py validates the workspace binding file with jsonschema, a dev dependency here (it is
# installed at runtime through the agent SDKs). httpx is a runtime dependency (the ArcadeDB admin API).
DEP004 = ["jsonschema"]
