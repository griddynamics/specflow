[project]
name = "specflow"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.1.0",
    "asyncpg>=0.32.0",
    "claude-agent-sdk==0.2.174",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "httplib2>=0.22",
    "graphiti-core==0.30.2",
    "langfuse>=4,<5",
    "mcp>=2.3,<3",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "openinference-instrumentation>=0.1.72",
    "openai>=3.37.0,<4",
    "openai-agents>=0.22.3,<0.23",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "pyyaml>=6",
    "starlette>=1.10.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "temporalio>=1.34,<2",
    "temporalio-openai-agents[openinference]>=1.1,<2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# One object-storage SDK per cloud, imported lazily by storage/factory.py. The images install both.
gcp = ["google-cloud-storage>=3.17.1"]
aws = ["boto3>=1.43,<2"]

[project.scripts]
specflow = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["S110"]

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
    "types-httplib2>=0.32.0.20260720",
    "types-pyyaml>=6.0.12.20260906",
]

# deptry (validation/python/lint): src/ is the import root, so its packages are first party.
# Colocated test modules use the validation environment, not runtime imports.
[tool.deptry]
known_first_party = [
    "agent_runtime", "api", "auth", "db", "drive", "file_parsers", "graph", "llm", "logger", "storage", "temporal",
    "cli", "cloud_profile", "health", "settings",
    "example_lib", "graph_build", "mcp_qa_lib",  # examples/
]
extend_exclude = ["(^|.*/)(test_[^/]+|conftest)\\.py$"]

[tool.deptry.package_module_name_map]
google-api-python-client = ["googleapiclient"]
google-auth = ["google"]
google-cloud-storage = ["google"]
openai-agents = ["agents"]
openinference-instrumentation = ["openinference"]

# asyncpg is the SQLAlchemy driver selected by the "postgresql+asyncpg" URL in src/settings.py
# and is never imported by name, so deptry cannot see its use.
[tool.deptry.per_rule_ignores]
# temporalio-openai-agents ships the temporalio.openai_agents module inside the temporalio namespace,
# which deptry attributes to the temporalio package.
# botocore ships inside the `aws` extra's boto3 (same release train); storage/s3.py imports its Config and ClientError.
DEP001 = ["botocore"]
DEP002 = ["asyncpg", "temporalio-openai-agents"]
# examples/mcp_qa_lib.py uses httpx, a dev dependency here (the QA harness is dev-only; it is installed at runtime
# through anthropic and openai).
DEP004 = ["httpx"]
