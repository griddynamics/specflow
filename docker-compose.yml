  specflow-rustfs-data:
    name: specflow-rustfs-data
  specflow-temporal-data:
    name: specflow-temporal-data
  specflow-langfuse-postgres-data:
    name: specflow-langfuse-postgres-data
  specflow-langfuse-clickhouse-data:
    name: specflow-langfuse-clickhouse-data
  specflow-langfuse-minio-data:
    name: specflow-langfuse-minio-data
  specflow-postgres-data:
    name: specflow-postgres-data
  specflow-neo4j-data:
    name: specflow-neo4j-data
  specflow-graph-state:
    name: specflow-graph-state
