name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What change would solve it? Describe other options you considered, if any.
    validations:
      required: true
