name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Docker version, how you started the stack (for example `make up WITH=temporal`), and the commit or release.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `make logs`. Remove secrets and private data first.
      render: text
