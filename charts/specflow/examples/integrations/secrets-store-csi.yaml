# Layer this file after examples/components/api.yaml. Install Secrets Store CSI
# Driver, enable secret syncing, and install the AWS provider before using this
# example. The remote JSON object must contain every required API Secret key.
# Replace the provider and parameters for another secret backend.
volumes:
  - name: tmp
    emptyDir: {}
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: specflow-api

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: secrets-store-inline
    mountPath: /mnt/secrets-store
    readOnly: true

extraObjects:
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: specflow-api
      namespace: '{{ .Release.Namespace }}'
    spec:
      provider: aws
      secretObjects:
        - secretName: specflow-api
          type: Opaque
          data:
            - objectName: APP_ENV
              key: APP_ENV
            - objectName: API_PORT
              key: API_PORT
            - objectName: GRAPH_STATE_DIR
              key: GRAPH_STATE_DIR
            - objectName: AUTH_TOKEN_TYPE
              key: AUTH_TOKEN_TYPE
            - objectName: DRIVE_IDENTITY_EMAIL
              key: DRIVE_IDENTITY_EMAIL
            - objectName: AUTH_API_AUDIENCE
              key: AUTH_API_AUDIENCE
            - objectName: AUTH_API_CLIENT_IDS
              key: AUTH_API_CLIENT_IDS
            - objectName: AUTH_ALLOWED_EMAIL_DOMAINS
              key: AUTH_ALLOWED_EMAIL_DOMAINS
            - objectName: STORAGE_BUCKET
              key: STORAGE_BUCKET
            - objectName: STORAGE_PREFIX
              key: STORAGE_PREFIX
            - objectName: GOOGLE_CLOUD_PROJECT
              key: GOOGLE_CLOUD_PROJECT
            - objectName: TEMPORAL_ADDRESS
              key: TEMPORAL_ADDRESS
            - objectName: TEMPORAL_NAMESPACE
              key: TEMPORAL_NAMESPACE
            - objectName: GRAPH_STORE_URI
              key: GRAPH_STORE_URI
            - objectName: GRAPH_STORE_USER
              key: GRAPH_STORE_USER
            - objectName: AGENT_MODEL
              key: AGENT_MODEL
            - objectName: AGENT_TRACE_SENSITIVE_DATA
              key: AGENT_TRACE_SENSITIVE_DATA
            - objectName: LANGFUSE_BASE_URL
              key: LANGFUSE_BASE_URL
            - objectName: LANGFUSE_PUBLIC_KEY
              key: LANGFUSE_PUBLIC_KEY
            - objectName: DATABASE_HOST
              key: DATABASE_HOST
            - objectName: DATABASE_NAME
              key: DATABASE_NAME
            - objectName: DATABASE_USER
              key: DATABASE_USER
            - objectName: OIDC_ISSUER
              key: OIDC_ISSUER
            - objectName: LLM_GATEWAY_URL
              key: LLM_GATEWAY_URL
            - objectName: GRAPH_LLM_MODEL
              key: GRAPH_LLM_MODEL
            - objectName: GRAPH_SMALL_MODEL
              key: GRAPH_SMALL_MODEL
            - objectName: GRAPH_EMBEDDING_MODEL
              key: GRAPH_EMBEDDING_MODEL
            - objectName: GRAPH_EMBEDDING_DIM
              key: GRAPH_EMBEDDING_DIM
            - objectName: DATABASE_PASSWORD
              key: DATABASE_PASSWORD
            - objectName: GRAPH_STORE_PASSWORD
              key: GRAPH_STORE_PASSWORD
            - objectName: LLM_GATEWAY_API_KEY
              key: LLM_GATEWAY_API_KEY
            - objectName: LANGFUSE_SECRET_KEY
              key: LANGFUSE_SECRET_KEY
      parameters:
        region: us-east-1
        objects: |
          - objectName: "specflow/api"
            objectType: "secretsmanager"
            jmesPath:
              - path: "APP_ENV"
                objectAlias: "APP_ENV"
              - path: "API_PORT"
                objectAlias: "API_PORT"
              - path: "GRAPH_STATE_DIR"
                objectAlias: "GRAPH_STATE_DIR"
              - path: "AUTH_TOKEN_TYPE"
                objectAlias: "AUTH_TOKEN_TYPE"
              - path: "DRIVE_IDENTITY_EMAIL"
                objectAlias: "DRIVE_IDENTITY_EMAIL"
              - path: "AUTH_API_AUDIENCE"
                objectAlias: "AUTH_API_AUDIENCE"
              - path: "AUTH_API_CLIENT_IDS"
                objectAlias: "AUTH_API_CLIENT_IDS"
              - path: "AUTH_ALLOWED_EMAIL_DOMAINS"
                objectAlias: "AUTH_ALLOWED_EMAIL_DOMAINS"
              - path: "STORAGE_BUCKET"
                objectAlias: "STORAGE_BUCKET"
              - path: "STORAGE_PREFIX"
                objectAlias: "STORAGE_PREFIX"
              - path: "GOOGLE_CLOUD_PROJECT"
                objectAlias: "GOOGLE_CLOUD_PROJECT"
              - path: "TEMPORAL_ADDRESS"
                objectAlias: "TEMPORAL_ADDRESS"
              - path: "TEMPORAL_NAMESPACE"
                objectAlias: "TEMPORAL_NAMESPACE"
              - path: "GRAPH_STORE_URI"
                objectAlias: "GRAPH_STORE_URI"
              - path: "GRAPH_STORE_USER"
                objectAlias: "GRAPH_STORE_USER"
              - path: "AGENT_MODEL"
                objectAlias: "AGENT_MODEL"
              - path: "AGENT_TRACE_SENSITIVE_DATA"
                objectAlias: "AGENT_TRACE_SENSITIVE_DATA"
              - path: "LANGFUSE_BASE_URL"
                objectAlias: "LANGFUSE_BASE_URL"
              - path: "LANGFUSE_PUBLIC_KEY"
                objectAlias: "LANGFUSE_PUBLIC_KEY"
              - path: "DATABASE_HOST"
                objectAlias: "DATABASE_HOST"
              - path: "DATABASE_NAME"
                objectAlias: "DATABASE_NAME"
              - path: "DATABASE_USER"
                objectAlias: "DATABASE_USER"
              - path: "OIDC_ISSUER"
                objectAlias: "OIDC_ISSUER"
              - path: "LLM_GATEWAY_URL"
                objectAlias: "LLM_GATEWAY_URL"
              - path: "GRAPH_LLM_MODEL"
                objectAlias: "GRAPH_LLM_MODEL"
              - path: "GRAPH_SMALL_MODEL"
                objectAlias: "GRAPH_SMALL_MODEL"
              - path: "GRAPH_EMBEDDING_MODEL"
                objectAlias: "GRAPH_EMBEDDING_MODEL"
              - path: "GRAPH_EMBEDDING_DIM"
                objectAlias: "GRAPH_EMBEDDING_DIM"
              - path: "DATABASE_PASSWORD"
                objectAlias: "DATABASE_PASSWORD"
              - path: "GRAPH_STORE_PASSWORD"
                objectAlias: "GRAPH_STORE_PASSWORD"
              - path: "LLM_GATEWAY_API_KEY"
                objectAlias: "LLM_GATEWAY_API_KEY"
              - path: "LANGFUSE_SECRET_KEY"
                objectAlias: "LANGFUSE_SECRET_KEY"
