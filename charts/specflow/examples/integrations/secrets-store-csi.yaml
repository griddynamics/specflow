# Layer this file after examples/components/api.yaml. Install Secrets Store CSI
# Driver, enable secret syncing, and install the AWS provider before using this
# example. Replace the provider and parameters for another secret backend.
volumes:
  - name: tmp
    emptyDir: {}
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: specflow-api

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: secrets-store-inline
    mountPath: /mnt/secrets-store
    readOnly: true

extraObjects:
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: specflow-api
      namespace: '{{ .Release.Namespace }}'
    spec:
      provider: aws
      secretObjects:
        - secretName: specflow-api
          type: Opaque
          data:
            - objectName: database-password
              key: DATABASE_PASSWORD
            - objectName: graph-store-password
              key: GRAPH_STORE_PASSWORD
            - objectName: llm-gateway-api-key
              key: LLM_GATEWAY_API_KEY
            - objectName: langfuse-secret-key
              key: LANGFUSE_SECRET_KEY
      parameters:
        region: us-east-1
        objects: |
          - objectName: "specflow/api"
            objectType: "secretsmanager"
            jmesPath:
              - path: "database_password"
                objectAlias: "database-password"
              - path: "graph_store_password"
                objectAlias: "graph-store-password"
              - path: "llm_gateway_api_key"
                objectAlias: "llm-gateway-api-key"
              - path: "langfuse_secret_key"
                objectAlias: "langfuse-secret-key"
