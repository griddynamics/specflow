# Layer this file after examples/components/api.yaml. External Secrets Operator
# and the referenced SecretStore must already exist in the cluster. The remote
# objects must expose keys matching the Secret keys used by the API profile.
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: '{{ include "specflow.fullname" . }}'
      namespace: '{{ .Release.Namespace }}'
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: example-secret-store
      target:
        name: specflow-api
        creationPolicy: Owner
      dataFrom:
        - extract:
            key: specflow/api
        - extract:
            key: specflow/database
