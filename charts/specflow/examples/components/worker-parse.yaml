component: worker-parse
replicaCount: 1

# Create a Secret named specflow-worker-parse before installation.

image:
  registry: docker.io
  repository: griddynamics/specflow-worker-parse
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

command: []
args: []
containerPorts:
  - name: health
    containerPort: 8001
    protocol: TCP

env:
  - name: APP_ENV
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: APP_ENV
  - name: WORKER_QUEUES
    value: parse
  - name: WORKER_HEALTH_PORT
    value: "8001"
  - name: DRIVE_IDENTITY_EMAIL
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: DRIVE_IDENTITY_EMAIL
  - name: STORAGE_BUCKET
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: STORAGE_BUCKET
  - name: STORAGE_PREFIX
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: STORAGE_PREFIX
  - name: GOOGLE_CLOUD_PROJECT
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: GOOGLE_CLOUD_PROJECT
  - name: TEMPORAL_ADDRESS
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: TEMPORAL_ADDRESS
  - name: TEMPORAL_NAMESPACE
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: TEMPORAL_NAMESPACE
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: DATABASE_HOST
  - name: DATABASE_NAME
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: DATABASE_NAME
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: DATABASE_USER
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: specflow-worker-parse
        key: DATABASE_PASSWORD
envFrom: []

resources:
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 3Gi

terminationGracePeriodSeconds: 150
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet: null
  exec:
    command:
      - specflow
      - worker
      - --check
  periodSeconds: 30
  timeoutSeconds: 25
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

service:
  enabled: false
  type: ClusterIP
  annotations: {}
  ports: []

persistence:
  enabled: false
  existingClaim: ""
  name: data
  mountPath: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  retain: true
  annotations: {}

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 1Gi
volumeMounts:
  - name: tmp
    mountPath: /tmp

routing:
  type: none
  hostnames: []
  paths: []
  ingress:
    className: ""
    annotations: {}
    tls: []
  httpRoute:
    parentRefs: []
    annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1
