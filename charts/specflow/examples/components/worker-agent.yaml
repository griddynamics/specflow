component: worker-agent
replicaCount: 1

# Create a ConfigMap and Secret named specflow-worker-agent before installation.
# Remove optional env entries that are not used by your deployment.

image:
  registry: ghcr.io
  repository: griddynamics/specflow-worker-agents
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

command: []
args: []
containerPorts:
  - name: health
    containerPort: 8001
    protocol: TCP

env:
  - name: APP_ENV
    value: prod
  - name: WORKER_QUEUES
    value: agents
  - name: WORKER_HEALTH_PORT
    value: "8001"
  - name: STORAGE_BUCKET
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: STORAGE_BUCKET
  - name: STORAGE_PREFIX
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: STORAGE_PREFIX
  - name: GOOGLE_CLOUD_PROJECT
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: GOOGLE_CLOUD_PROJECT
  - name: TEMPORAL_ADDRESS
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: TEMPORAL_ADDRESS
  - name: TEMPORAL_NAMESPACE
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: TEMPORAL_NAMESPACE
  - name: GRAPH_STORE_URI
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: GRAPH_STORE_URI
  - name: GRAPH_STORE_USER
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: GRAPH_STORE_USER
  - name: AGENT_MODEL
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: AGENT_MODEL
  - name: AGENT_TRACE_SENSITIVE_DATA
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: AGENT_TRACE_SENSITIVE_DATA
  - name: LANGFUSE_BASE_URL
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: LANGFUSE_BASE_URL
  - name: LANGFUSE_PUBLIC_KEY
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: LANGFUSE_PUBLIC_KEY
  - name: DATABASE_HOST
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: DATABASE_HOST
  - name: DATABASE_NAME
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: DATABASE_NAME
  - name: DATABASE_USER
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: DATABASE_USER
  - name: LLM_GATEWAY_URL
    valueFrom:
      configMapKeyRef:
        name: specflow-worker-agent
        key: LLM_GATEWAY_URL
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: specflow-worker-agent
        key: DATABASE_PASSWORD
  - name: DATABASE_AGENT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: specflow-worker-agent
        key: DATABASE_AGENT_PASSWORD
  - name: GRAPH_STORE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: specflow-worker-agent
        key: GRAPH_STORE_PASSWORD
  - name: LLM_GATEWAY_API_KEY
    valueFrom:
      secretKeyRef:
        name: specflow-worker-agent
        key: LLM_GATEWAY_API_KEY
  - name: LANGFUSE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: specflow-worker-agent
        key: LANGFUSE_SECRET_KEY
envFrom: []

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

terminationGracePeriodSeconds: 150
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet: null
  exec:
    command:
      - specflow
      - worker
      - --check
  periodSeconds: 30
  timeoutSeconds: 25
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /healthz
    port: health
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

service:
  enabled: false
  type: ClusterIP
  annotations: {}
  ports: []

persistence:
  enabled: false
  existingClaim: ""
  name: data
  mountPath: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  retain: true
  annotations: {}

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 256Mi
volumeMounts:
  - name: tmp
    mountPath: /tmp

routing:
  type: none
  hostnames: []
  paths: []
  ingress:
    className: ""
    annotations: {}
    tls: []
  httpRoute:
    parentRefs: []
    annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

