component: api
replicaCount: 1

# Create a Secret named specflow-api before installation. Remove optional env
# entries that are not used by your deployment.

image:
  registry: ghcr.io
  repository: griddynamics/specflow-api
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

command: []
args: []
containerPorts:
  - name: http
    containerPort: 8000
    protocol: TCP

env:
  - name: APP_ENV
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: APP_ENV
  - name: API_PORT
    value: "8000"
  - name: GRAPH_STATE_DIR
    value: /var/lib/specflow/graph
  - name: AUTH_TOKEN_TYPE
    value: keycloak
  - name: DRIVE_IDENTITY_EMAIL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: DRIVE_IDENTITY_EMAIL
  - name: AUTH_API_AUDIENCE
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: AUTH_API_AUDIENCE
  - name: AUTH_API_CLIENT_IDS
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: AUTH_API_CLIENT_IDS
  - name: AUTH_ALLOWED_EMAIL_DOMAINS
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: AUTH_ALLOWED_EMAIL_DOMAINS
  - name: STORAGE_BUCKET
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: STORAGE_BUCKET
  - name: STORAGE_PREFIX
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: STORAGE_PREFIX
  - name: GOOGLE_CLOUD_PROJECT
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GOOGLE_CLOUD_PROJECT
  - name: TEMPORAL_ADDRESS
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: TEMPORAL_ADDRESS
  - name: TEMPORAL_NAMESPACE
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: TEMPORAL_NAMESPACE
  - name: GRAPH_STORE_URI
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GRAPH_STORE_URI
  - name: GRAPH_STORE_USER
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GRAPH_STORE_USER
  - name: AGENT_MODEL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: AGENT_MODEL
  - name: AGENT_TRACE_SENSITIVE_DATA
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: AGENT_TRACE_SENSITIVE_DATA
  - name: LANGFUSE_BASE_URL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: LANGFUSE_BASE_URL
  - name: LANGFUSE_PUBLIC_KEY
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: LANGFUSE_PUBLIC_KEY
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: DATABASE_HOST
  - name: DATABASE_NAME
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: DATABASE_NAME
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: DATABASE_USER
  - name: OIDC_ISSUER
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: OIDC_ISSUER
  # The agent routes the MCP server reads through: the same three values as the specflow-mcp Secret. Without
  # MCP_RESOURCE_URL they answer 503 agent_unavailable.
  - name: MCP_RESOURCE_URL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: MCP_RESOURCE_URL
        optional: true
  - name: MCP_AUDIENCE
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: MCP_AUDIENCE
        optional: true
  - name: MCP_CLIENT_IDS
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: MCP_CLIENT_IDS
        optional: true
  - name: LLM_GATEWAY_URL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: LLM_GATEWAY_URL
  - name: GRAPH_LLM_MODEL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GRAPH_LLM_MODEL
  - name: GRAPH_SMALL_MODEL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GRAPH_SMALL_MODEL
  - name: GRAPH_EMBEDDING_MODEL
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GRAPH_EMBEDDING_MODEL
  - name: GRAPH_EMBEDDING_DIM
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GRAPH_EMBEDDING_DIM
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: DATABASE_PASSWORD
  - name: GRAPH_STORE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: GRAPH_STORE_PASSWORD
  - name: LLM_GATEWAY_API_KEY
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: LLM_GATEWAY_API_KEY
  - name: LANGFUSE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: LANGFUSE_SECRET_KEY
  - name: PGSSLROOTCERT
    valueFrom:
      secretKeyRef:
        name: specflow-api
        key: PGSSLROOTCERT
        optional: true
envFrom: []

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

terminationGracePeriodSeconds: 30
strategy:
  type: Recreate

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

persistence:
  enabled: true
  existingClaim: ""
  name: graph-state
  mountPath: /var/lib/specflow/graph
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  retain: true
  annotations: {}

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

routing:
  type: none
  hostnames: []
  paths:
    - path: /
      pathType: Prefix
  ingress:
    className: ""
    annotations: {}
    tls: []
  httpRoute:
    parentRefs: []
    annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

