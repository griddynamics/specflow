component: mcp
replicaCount: 1

# Create a Secret named specflow-mcp before installation.

image:
  registry: docker.io
  repository: griddynamics/specflow-mcp
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# The specflow-mcp image starts `specflow mcp` itself.
command: []
args: []
containerPorts:
  - name: http
    containerPort: 8002
    protocol: TCP

env:
  - name: APP_ENV
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: APP_ENV
  - name: MCP_PORT
    value: "8002"
  - name: API_INTERNAL_URL
    value: http://specflow-api:8000
  - name: AUTH_TOKEN_TYPE
    value: keycloak
  - name: MCP_RESOURCE_URL
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: MCP_RESOURCE_URL
  - name: MCP_AUDIENCE
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: MCP_AUDIENCE
  - name: MCP_CLIENT_IDS
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: MCP_CLIENT_IDS
  - name: OIDC_ISSUER
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: OIDC_ISSUER
  - name: AUTH_API_AUDIENCE
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: AUTH_API_AUDIENCE
  - name: AUTH_API_CLIENT_IDS
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: AUTH_API_CLIENT_IDS
  - name: AUTH_ALLOWED_EMAIL_DOMAINS
    valueFrom:
      secretKeyRef:
        name: specflow-mcp
        key: AUTH_ALLOWED_EMAIL_DOMAINS
envFrom: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

terminationGracePeriodSeconds: 30
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 8002
      targetPort: http
      protocol: TCP

persistence:
  enabled: false
  existingClaim: ""
  name: data
  mountPath: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  retain: true
  annotations: {}

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

routing:
  type: none
  hostnames: []
  paths:
    - path: /mcp
      pathType: Prefix
    - path: /.well-known/oauth-protected-resource
      pathType: Prefix
  ingress:
    className: ""
    annotations: {}
    tls: []
  httpRoute:
    parentRefs: []
    annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

