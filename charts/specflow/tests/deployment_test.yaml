suite: Deployment
templates:
  - deployment.yaml
tests:
  - it: renders the secure API defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: uses appVersion when image tag is empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/griddynamics/specflow-api:2.0.0

  - it: supports an immutable image digest
    set:
      image.tag: ""
      image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/griddynamics/specflow-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: renders Kubernetes-native environment sources
    set:
      env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database
              key: password
      envFrom:
        - configMapRef:
            name: application
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: database
                key: password
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: application

  - it: renders scheduling settings
    set:
      priorityClassName: production
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: specflow
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: production
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
