{{- if eq .Values.routing.type "httpRoute" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "specflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "specflow.labels" . | nindent 4 }}
  {{- with .Values.routing.httpRoute.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- tpl (toYaml .Values.routing.httpRoute.parentRefs) . | nindent 4 }}
  hostnames:
    {{- tpl (toYaml .Values.routing.hostnames) . | nindent 4 }}
  rules:
    {{- range $path := .Values.routing.paths }}
    - matches:
        - path:
            type: {{ ternary "PathPrefix" "Exact" (eq $path.pathType "Prefix") }}
            value: {{ $path.path | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "specflow.fullname" $ }}
          port: {{ include "specflow.primaryServicePort" $ }}
          weight: 1
    {{- end }}
{{- end }}

